[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "makeupmous-annotation_agreement_bias_dedup"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出Agent 编排平台工程师·标注一致性与标注者偏差上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "makeupmous" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://makeupmous.github.io"
Repository = "https://github.com/makeupmous/annotation_agreement_bias_dedup"
Issues = "https://github.com/makeupmous/annotation_agreement_bias_dedup/issues"

[project.scripts]
annotation_agreement_bias_dedup = "annotation_agreement_bias_dedup:main"

[tool.setuptools]
py-modules = ["annotation_agreement_bias_dedup"]
